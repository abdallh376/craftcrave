<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4 text-white relative">
  <div class="absolute top-4 end-4">
    <app-language-switcher></app-language-switcher>
  </div>
  <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    
    <!-- Header Gradient Line -->
    <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-amber-500 to-amber-600"></div>

    <!-- Top Icon & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500/10 text-amber-500 rounded-full text-2xl mb-3 border border-amber-500/20 shadow-inner">
        🔐
      </div>
      <h2 class="text-2xl font-black tracking-tight">{{ 'login.title' | translate }}</h2>
      <p class="text-gray-400 text-xs mt-1">{{ 'login.subtitle' | translate }}</p>
    </div>

    <!-- Error Alert Message -->
    <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-xl mb-4 text-center font-bold animate-pulse">
      {{ errorMessage }}
    </div>

    <!-- Credentials Hint Box for Testing -->
    <div class="bg-amber-500/5 border border-amber-500/15 rounded-xl p-3 mb-6 text-xs text-amber-300/90 text-center">
      <span class="font-bold">{{ 'login.demoTitle' | translate }}</span> <br>
      {{ 'login.usernameHint' | translate }}: <code class="bg-gray-950 px-1.5 py-0.5 rounded text-amber-400">admin</code> | {{ 'login.passwordHint' | translate }}: <code class="bg-gray-950 px-1.5 py-0.5 rounded text-amber-400">123456</code>
    </div>

    <!-- Form Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-400 mb-2">{{ 'login.usernameLabel' | translate }}</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          placeholder="admin" 
          class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 mb-2">{{ 'login.passwordLabel' | translate }}</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          placeholder="******" 
          class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-white transition">
      </div>

      <button 
        (click)="onLogin()" 
        class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-bold py-3.5 rounded-xl text-sm transition cursor-pointer shadow-lg shadow-amber-500/20 mt-2">
        {{ 'login.submit' | translate }} 🚀
      </button>
    </div>

    <!-- Back to Home Link -->
    <div class="text-center mt-6">
      <a routerLink="/" class="text-xs text-gray-500 hover:text-amber-400 transition font-medium">
        <span class="inline-block rtl:rotate-180">←</span> {{ 'login.back' | translate }}
      </a>
    </div>

  </div>
</div>
