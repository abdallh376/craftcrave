<div class="min-h-screen bg-gray-950 py-10 px-4 text-white">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-black mb-8 text-amber-500">{{ 'favorites.title' | translate }} ❤️</h1>
    
    <div *ngIf="favorites.length === 0" class="text-center py-20 text-gray-500">
      <p class="text-xl">{{ 'favorites.empty' | translate }}</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
      <div *ngFor="let item of favorites" class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 flex flex-col justify-between">
        
        <div class="relative h-48 bg-gray-800">
          <img [src]="item.image" class="w-full h-full object-cover">
          <button (click)="removeFav(item)" class="absolute top-3 end-3 bg-red-600 text-white p-2 rounded-full text-xs cursor-pointer shadow-lg hover:scale-110 transition">❤️</button>
        </div>

        <div class="p-5 flex-1 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-lg mb-1">{{ item.name }}</h3>
            <p class="text-amber-500 font-bold mb-4">${{ item.price }}</p>
          </div>

          <!-- منطقة التحكم بالكمية أو الإضافة -->
          <div>
            <!-- الحالة الأولى: لم يتم الإضافة بعد -->
            <button *ngIf="!item.orderQuantity || item.orderQuantity === 0" 
                    (click)="addToCart(item)" 
                    class="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-xl font-semibold text-sm cursor-pointer transition shadow-lg shadow-amber-500/20">
              {{ 'favorites.addToCart' | translate }} 🛒
            </button>

            <!-- الحالة الثانية: تم الإضافة (يظهر شريط التحكم بالكمية + و -) -->
            <div *ngIf="item.orderQuantity > 0" class="flex items-center justify-between bg-gray-800 rounded-xl p-1.5 border border-gray-700">
              <button (click)="decreaseQuantity(item)" class="w-9 h-9 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-bold flex items-center justify-center transition-all cursor-pointer">
                -
              </button>
              
              <span class="text-white font-bold text-sm px-4">
                {{ item.orderQuantity }}
              </span>

              <button (click)="increaseQuantity(item)" class="w-9 h-9 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold flex items-center justify-center transition-all cursor-pointer">
                +
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>
